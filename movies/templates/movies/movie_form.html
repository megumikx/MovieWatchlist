<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Movie</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body style="background-color: #f5f1f8;">

<nav class="navbar navbar-dark" style="background-color: #54206f;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'movie_list' %}">
            🎬 Movie Watchlist
        </a>

        <a href="{% url 'movie_list' %}" class="btn btn-outline-light">
            Back
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h2 class="mb-4" style="color: #54206f;">
                        Add Movie
                    </h2>

                    <form method="post">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit"
                                class="btn text-white"
                                style="background-color: #54206f;">
                            Save Movie
                        </button>

                        <a href="{% url 'movie_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>
                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

</body>
</html>
